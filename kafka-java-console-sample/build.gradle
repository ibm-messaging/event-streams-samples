plugins {
  id 'application'
  id 'java'
  id 'eclipse'
}

group = 'com.ibm.eventstreams.samples'
version = '2.0'
mainClassName = 'com.eventstreams.samples.EventStreamsConsoleSample'

sourceCompatibility = 11
targetCompatibility = 11

repositories {
  mavenCentral()
  flatDir {
        dirs 'libs'
  }
}

dependencies {
  implementation 'org.apache.kafka:kafka-clients:3.8.+'
  //implementation ('com.ibm.cloud.eventstreams:oauth-client:1.3.1')
  files('libs/oauth-client-1.3.2.jar')
  implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.24.+'
  implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.24.+'
  implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.24.+'
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.+'
}

jar {
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
  manifest {
    attributes('Main-Class': mainClassName)
  }
  from {
    configurations.compileClasspath.filter{ it.exists() }.collect { it.isDirectory() ? it : zipTree(it) }
  }
}

